[package]
name = "m365-rs"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "m365-refresh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
